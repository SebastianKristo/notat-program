name: Build & Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
      - run: npx cap add android && npx cap sync android
      - name: App icon
        run: npx capacitor-assets generate --android --iconBackgroundColor '#1d1c1a' --iconBackgroundColorDark '#1d1c1a'
      - name: Allow http to self-hosted server
        run: sed -i '0,/<application/s//<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: mkdir -p out && cp android/app/build/outputs/apk/debug/app-debug.apk out/Marg-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/Marg-android.apk }

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx cap add ios && npx cap sync ios
      - name: App icon
        run: npx capacitor-assets generate --ios --iconBackgroundColor '#1d1c1a'
      - name: Build unsigned IPA (iPhone + iPad)
        run: |
          /usr/libexec/PlistBuddy -c "Set :UIRequiresFullScreen false" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" ios/App/App/Info.plist
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            TARGETED_DEVICE_FAMILY="1,2" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload out
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr out/Marg-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: out/Marg-ios-unsigned.ipa }

  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: mkdir -p out && cp release/*.dmg out/ 2>/dev/null || find . -name '*.dmg' -not -path './node_modules/*' -exec cp {} out/ \;
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: out/*.dmg }

  release:
    needs: [android, ios, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: Marg ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: files/*
          body: |
            Marg – privat skrive- og notatapp.

            - **Marg-android.apk** – Android (telefon og nettbrett). Installer direkte.
            - **Marg-ios-unsigned.ipa** – iPhone og iPad. Usignert: installer med Sideloadly/AltStore, eller signer med egen Apple-konto.
            - **Marg-*-mac.dmg** – macOS (Apple Silicon + Intel). Usignert: høyreklikk → Åpne første gang.

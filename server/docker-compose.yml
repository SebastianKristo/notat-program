name: marg

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../dist:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://marg:${POSTGRES_PASSWORD:?sett POSTGRES_PASSWORD i .env}@db:5432/marg
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      MARG_SECRET: ${MARG_SECRET:?sett MARG_SECRET i .env}
      FILES_DIR: /data/files
    volumes:
      - files_data:/data/files
    depends_on: [db]

  # Lar «Oppdater server» i appen hente ny kode og bygge tjenestene på nytt.
  updater:
    build: ./updater
    restart: unless-stopped
    environment:
      MARG_DIR: ${MARG_DIR:-/opt/marg}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${MARG_DIR:-/opt/marg}:${MARG_DIR:-/opt/marg}

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: marg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: marg
    volumes: [db_data:/var/lib/postgresql/data]

  # Lokal Ollama er valgfri: start med `docker compose --profile ollama up -d`.
  # Bruker du en Ollama et annet sted (f.eks. en Mac mini), sett OLLAMA_URL i .env i stedet.
  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    restart: unless-stopped
    volumes: [ollama_data:/root/.ollama]
    # Fjern kommentaren for NVIDIA-GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  ollama-pull:
    image: ollama/ollama:latest
    profiles: [ollama]
    depends_on: [ollama]
    environment: { OLLAMA_HOST: ollama:11434 }
    entrypoint: ["/bin/sh", "-c", "sleep 5; for m in ${OLLAMA_MODELS:-llama3.1:8b nomic-embed-text}; do ollama pull $$m; done"]
    restart: "no"

  # Sikkerhetskopi til SMB-deling. Oppsett og tidsplan styres fra appen (Innstillinger → Sikkerhetskopi).
  backup:
    build: { context: ., dockerfile: backup/Dockerfile }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://marg:${POSTGRES_PASSWORD}@db:5432/marg
      MARG_SECRET: ${MARG_SECRET}
      FILES_DIR: /data/files
    volumes:
      - files_data:/data/files
    depends_on: [db]

  # Valgfri transkribering for møtenotater: docker compose --profile whisper up -d
  # og bruk http://whisper:9000 under Innstillinger → Møtenotater.
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    profiles: [whisper]
    restart: unless-stopped
    environment:
      ASR_MODEL: ${WHISPER_MODEL:-small}
      ASR_ENGINE: faster_whisper
    volumes: [whisper_cache:/root/.cache]

volumes:
  whisper_cache:
  files_data:
  db_data:
  ollama_data:
  caddy_data:
  caddy_config:

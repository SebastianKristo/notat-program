services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-notes.kristo.no}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../dist:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://marg:${POSTGRES_PASSWORD:?sett POSTGRES_PASSWORD i .env}@db:5432/marg
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
    depends_on: [db]

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: marg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: marg
    volumes: [db_data:/var/lib/postgresql/data]

  # Lokal Ollama er valgfri: start med `docker compose --profile ollama up -d`.
  # Bruker du en Ollama et annet sted (f.eks. en Mac mini), sett OLLAMA_URL i .env i stedet.
  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    restart: unless-stopped
    volumes: [ollama_data:/root/.ollama]
    # Fjern kommentaren for NVIDIA-GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  ollama-pull:
    image: ollama/ollama:latest
    profiles: [ollama]
    depends_on: [ollama]
    environment: { OLLAMA_HOST: ollama:11434 }
    entrypoint: ["/bin/sh", "-c", "sleep 5; for m in ${OLLAMA_MODELS:-llama3.1:8b nomic-embed-text}; do ollama pull $$m; done"]
    restart: "no"

  backup:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes: [./backups:/backups]
    entrypoint: ["/bin/sh", "-c", "while true; do pg_dump -h db -U marg marg | gzip > /backups/marg-$$(date +%F).sql.gz; find /backups -name '*.sql.gz' -mtime +14 -delete; sleep 86400; done"]
    depends_on: [db]

volumes:
  db_data:
  ollama_data:
  caddy_data:
  caddy_config:
